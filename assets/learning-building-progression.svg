<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Learning to Building Progression</title>
  <desc id="desc">A seven-stage AI engineering progression from GenAI foundations through production-ready AI applications, with engineering disciplines applied across the journey.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="55%" stop-color="#F3F9FC"/>
      <stop offset="100%" stop-color="#EEF7F7"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1F4D"/>
      <stop offset="55%" stop-color="#1367A8"/>
      <stop offset="100%" stop-color="#0D8D91"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E5AA7"/>
      <stop offset="50%" stop-color="#23A7C8"/>
      <stop offset="100%" stop-color="#0C9A8D"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FBFD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1F4D" flood-opacity="0.10"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0B1F4D" flood-opacity="0.07"/>
    </filter>
    <style>
      .font { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .stage-title { font-weight: 760; font-size: 25px; fill: #10224A; }
      .stage-copy { font-weight: 450; font-size: 18px; fill: #4C5B78; }
      .chip { font-weight: 650; font-size: 17px; fill: #EAF4FF; }
      .num { font-weight: 800; font-size: 22px; fill: white; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 180 C260 120, 460 220, 720 152 S1180 100,1600 165 L1600 0 L0 0 Z" fill="#EAF5FC" opacity="0.7"/>
  <circle cx="1490" cy="70" r="115" fill="#DFF4F3" opacity="0.55"/>
  <circle cx="1390" cy="120" r="46" fill="#DDEEFF" opacity="0.70"/>

  <g class="font">
    <text x="72" y="98" font-size="62" font-weight="820" fill="url(#titleGrad)">Learning → Building Progression</text>
    <text x="76" y="145" font-size="29" font-weight="560" fill="#51607B">From foundations to production-ready AI applications</text>

    <g transform="translate(1180 58)" filter="url(#soft)">
      <rect x="0" y="0" rx="22" ry="22" width="345" height="102" fill="#FFFFFF" stroke="#B7E8E8" stroke-width="2"/>
      <circle cx="53" cy="51" r="28" fill="#E5F7F6"/>
      <path d="M42 60 L58 44 L66 52 L78 38" fill="none" stroke="#0B8E91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="60" r="4" fill="#1C63B7"/><circle cx="58" cy="44" r="4" fill="#1C63B7"/><circle cx="78" cy="38" r="4" fill="#0B8E91"/>
      <text x="96" y="40" font-size="22" font-weight="780" fill="#123564">Build and Forge mindset</text>
      <text x="96" y="69" font-size="16" font-weight="500" fill="#5A6881">Learn deeply. Build intentionally.</text>
      <text x="96" y="90" font-size="16" font-weight="500" fill="#5A6881">Validate, integrate, and ship.</text>
    </g>

    <g transform="translate(58 228)">
      <rect x="0" y="0" width="1484" height="450" rx="34" fill="url(#panelGrad)" stroke="#D6E7F2" stroke-width="2" filter="url(#shadow)"/>
      <text x="40" y="55" font-size="16" font-weight="760" letter-spacing="3.2" fill="#6B7C95">CAPABILITY RUNWAY</text>

      <path d="M102 296 C250 302, 320 268, 423 263 S630 238, 739 220 S946 190, 1054 167 S1260 128, 1384 100" fill="none" stroke="#DDEAF3" stroke-width="18" stroke-linecap="round"/>
      <path d="M102 296 C250 302, 320 268, 423 263 S630 238, 739 220 S946 190, 1054 167 S1260 128, 1384 100" fill="none" stroke="url(#pathGrad)" stroke-width="7" stroke-linecap="round"/>

      <g transform="translate(95 289)">
        <circle r="28" fill="#1558A6" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">1</text>
        <line x1="0" y1="32" x2="0" y2="74" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">GenAI</text><text class="stage-title" text-anchor="middle" y="100">Foundations</text>
        <text class="stage-copy" text-anchor="middle" y="132">Models, prompting,</text><text class="stage-copy" text-anchor="middle" y="155">core concepts &amp; tools</text>
      </g>

      <g transform="translate(307 275)">
        <circle r="28" fill="#2375C6" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">2</text>
        <line x1="0" y1="32" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">RAG &amp;</text><text class="stage-title" text-anchor="middle" y="100">Grounded AI</text>
        <text class="stage-copy" text-anchor="middle" y="132">Retrieve evidence and</text><text class="stage-copy" text-anchor="middle" y="155">generate with context</text>
      </g>

      <g transform="translate(520 250)">
        <circle r="28" fill="#16A0AA" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">3</text>
        <line x1="0" y1="32" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">Hybrid RAG +</text><text class="stage-title" text-anchor="middle" y="100">Knowledge Graphs</text>
        <text class="stage-copy" text-anchor="middle" y="132">Combine semantic and</text><text class="stage-copy" text-anchor="middle" y="155">structured knowledge</text>
      </g>

      <g transform="translate(738 220)">
        <circle r="28" fill="#236AB8" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">4</text>
        <line x1="0" y1="32" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">AI Agents</text>
        <text class="stage-copy" text-anchor="middle" y="108">Plan, reason, use tools</text><text class="stage-copy" text-anchor="middle" y="135">and act with guardrails</text>
      </g>

      <g transform="translate(950 186)">
        <circle r="28" fill="#0D9893" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">5</text>
        <line x1="0" y1="32" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">Multi-Agent /</text><text class="stage-title" text-anchor="middle" y="100">Agentic Systems</text>
        <text class="stage-copy" text-anchor="middle" y="136">Coordinate specialized</text><text class="stage-copy" text-anchor="middle" y="163">agents and workflows</text>
      </g>

      <g transform="translate(1164 142)">
        <circle r="28" fill="#2375C6" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">6</text>
        <line x1="0" y1="32" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">AI Automation</text>
        <text class="stage-copy" text-anchor="middle" y="108">Integrate AI into real</text><text class="stage-copy" text-anchor="middle" y="135">business workflows</text>
      </g>

      <g transform="translate(1384 100)">
        <circle r="30" fill="#123B72" stroke="#FFFFFF" stroke-width="6"/><text class="num" text-anchor="middle" y="8">7</text>
        <line x1="0" y1="35" x2="0" y2="69" stroke="#AEC9DD" stroke-width="2"/>
        <text class="stage-title" text-anchor="middle" y="72">Production-Ready</text><text class="stage-title" text-anchor="middle" y="100">AI Applications</text>
        <text class="stage-copy" text-anchor="middle" y="136">Reliable, secure, scalable</text><text class="stage-copy" text-anchor="middle" y="163">and user-focused</text>
      </g>
    </g>

    <g transform="translate(58 690)">
      <rect x="0" y="0" width="1484" height="157" rx="30" fill="#0C234A" filter="url(#shadow)"/>
      <text x="42" y="48" font-size="25" font-weight="760" fill="#FFFFFF">Engineering disciplines applied across the journey</text>
      <text x="42" y="78" font-size="16" font-weight="500" fill="#AFC4DF">Production thinking is introduced early — not added at the end.</text>

      <g transform="translate(42 96)">
        <g><rect width="155" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="77" y="27" text-anchor="middle">Guardrails</text></g>
        <g transform="translate(166 0)"><rect width="155" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="77" y="27" text-anchor="middle">Evaluations</text></g>
        <g transform="translate(332 0)"><rect width="195" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="97" y="27" text-anchor="middle">Human-in-the-Loop</text></g>
        <g transform="translate(538 0)"><rect width="170" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="85" y="27" text-anchor="middle">Observability</text></g>
        <g transform="translate(719 0)"><rect width="170" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="85" y="27" text-anchor="middle">API Efficiency</text></g>
        <g transform="translate(900 0)"><rect width="130" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="65" y="27" text-anchor="middle">Docker</text></g>
        <g transform="translate(1041 0)"><rect width="185" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="92" y="27" text-anchor="middle">VPS Deployment</text></g>
        <g transform="translate(1237 0)"><rect width="165" height="42" rx="14" fill="#12345E" stroke="#2D5A88"/><text class="chip" x="82" y="27" text-anchor="middle">Enterprise UX</text></g>
      </g>
    </g>
  </g>
</svg>